[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "englishlearn"
version = "1.1.0"
description = "Local-first video language learning app: subtitle generation, translation, and AI learning notes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ye-muzhi" }]
keywords = ["english-learning", "subtitles", "translation", "streamlit", "whisper"]
dependencies = [
    "streamlit>=1.28.0",
    "yt-dlp>=2024.0.0",
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "static-ffmpeg>=3.0",
    "openai>=1.0.0",
    "httpx[socks]>=0.27.0",
    "transformers>=5.6.0",
    "huggingface-hub>=0.36.2",
    "safetensors>=0.7.0",
    "torch>=2.5.0",
]

[tool.setuptools.packages.find]
include = ["englishlearn*"]
