name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements-dev.txt
      - run: .venv/bin/python -B -m pytest -q -p no:cacheprovider
