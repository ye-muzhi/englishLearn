<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnglishLearn</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0f0f0f; color:#f1f1f1; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%,#272240,#0f0f0f 48%); }
    main { width:min(480px,calc(100vw - 48px)); text-align:center; }
    .mark { width:68px; height:48px; margin:auto; border-radius:16px; display:grid; place-items:center; background:#8b7cf6; box-shadow:0 18px 42px #4a3f9d55; font-size:22px; }
    h1 { margin:22px 0 8px; font-size:30px; letter-spacing:-.04em; }
    p { color:#aaa; line-height:1.6; }
    .bar { height:4px; overflow:hidden; border-radius:99px; background:#303030; margin:26px auto 14px; }
    .bar::after { content:""; display:block; width:38%; height:100%; background:#8b7cf6; animation:load 1.1s ease-in-out infinite alternate; }
    @keyframes load { from{transform:translateX(-20%)} to{transform:translateX(210%)} }
    #error { display:none; color:#ffaaa5; background:#421d1d; padding:12px; border-radius:12px; }
  </style>
</head>
<body><main><div class="mark">▶</div><h1>EnglishLearn</h1><p>正在准备本地学习环境…</p><div class="bar"></div><p id="error"></p></main></body>
</html>
