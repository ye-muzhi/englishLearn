[package]
name = "englishlearn-desktop"
version = "1.1.0"
description = "EnglishLearn desktop shell"
authors = ["EnglishLearn"]
edition = "2021"

[lib]
name = "englishlearn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
